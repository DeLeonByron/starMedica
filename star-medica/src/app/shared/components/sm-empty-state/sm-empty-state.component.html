<section class="sm-empty-state" role="status" aria-live="polite">
  <h2 class="sm-empty-state__title">{{ title() }}</h2>
  <p class="sm-empty-state__message">{{ message() }}</p>
  @if (actionLabel()) {
    <sm-button variant="secondary" (click)="actionRequested.emit()">
      {{ actionLabel() }}
    </sm-button>
  }
</section>
