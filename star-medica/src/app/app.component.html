<div class="app-shell">
  @if (auth.isLoggedIn() && navigation().length > 0) {
    <sm-sidebar
      [brandLink]="brandLink()"
      [items]="navigation()"
      [userName]="auth.user()?.fullName ?? ''"
      (logout)="logout()"
    />
  }

  <main class="app-shell__content">
    @if (auth.logoutError(); as logoutError) {
      <p class="app-shell__error" role="alert">{{ logoutError }}</p>
    }
    @if (auth.isLoggedIn() && breadcrumbs().length > 0) {
      <sm-breadcrumb [items]="breadcrumbs()" />
    }
    <router-outlet />
  </main>
</div>
